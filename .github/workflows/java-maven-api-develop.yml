name: Java Service with Maven

on:
  push:
    branches: [ develop, master, test ]
  pull_request:
    branches: [ develop, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B package -DskipTests -Pcode-quality
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar

  unit-test:
    name: Unit Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: Unit Test
        run: mvn -B test -Pcode-quality

  coverage:
    name: Code Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: Generate coverage report
        run: mvn -B test jacoco:report -Pcode-quality
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  contract-test:
    name: Contract Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: API Contract Testing
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          java -jar target/java-maven-quickstart-actions-$VERSION.jar &
          PID=$!
          sleep 20
          result=$(curl -s http://localhost:${PORT:-8080}/addition/1/2/3 | jq .result)
          if [ "$result" -eq 6 ]; then
            echo "API Contract Testing is successful"
          else
            echo "API Contract Testing failed"
            exit 1
          fi
          kill -9 $PID > /dev/null

  secret-scan:
    name: Secret Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GitLeaks
        uses: zricethezav/gitleaks-action@v3.0.0
        with:
          args: "--repo-path=. --verbose"

  dependency-scan:
    name: Dependency Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.base_ref || github.event.before }}
          head-ref: ${{ github.head_ref || github.sha }}

  container-scan:
    name: Container Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image version
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build Docker image
        run: docker build -t java-maven-quickstart-service:${VERSION} .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: java-maven-quickstart-service:${{ env.VERSION }}
          format: table
          output: trivy-results.txt
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.txt

  sonar:
    name: Static Code Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: SonarCloud Scan
        continue-on-error: true
        run: mvn -B clean verify -Psonar -Dsonar.login=$SONAR_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [unit-test, contract-test, sonar, coverage, secret-scan, dependency-scan, container-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: Deploy to Github Package Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>govindarajanv</username><password>${GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
          mvn clean deploy
      - name: Build Container Image
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          docker build -t govindarajanv/java-maven-quickstart-service:$VERSION .
          docker build -t govindarajanv/java-maven-quickstart-service:latest .
          docker images
      - name: Test Image
        run: |
          docker compose up -d
          docker ps
          sleep 60
          docker ps
          result=$(docker inspect --format='{{json .State.Health}}' calculator | jq ."Status")
          if [ "$result" != "\"healthy\"" ]; then exit 1; fi
      - name: Shut down the service
        run: docker compose down
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Publish the image
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          docker push govindarajanv/java-maven-quickstart-service:$VERSION
          docker push govindarajanv/java-maven-quickstart-service:latest
      - name: Share artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: target/*
          retention-days: 5
