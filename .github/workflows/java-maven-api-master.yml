name: Java Service with Maven

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B compile --file pom.xml

  unit-test:
    name: Unit Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Unit Test
        run: mvn -B clean verify

  coverage:
    name: Code Coverage
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Generate coverage report
        run: mvn -B clean verify
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  contract-test:
    name: Contract Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: API Contract Testing
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          mvn clean install
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          java -jar target/java-maven-quickstart-actions-$VERSION.jar &
          PID=$!
          sleep 20
          result=$(curl -s http://localhost:${PORT:-8080}/addition/1/2/3 | jq .result)
          if [ "$result" -eq 6 ]; then
            echo "API Contract Testing is successful"
          else
            echo "API Contract Testing failed"
            exit 1
          fi
          kill -9 $PID > /dev/null

  secret-scan:
    name: Secret Scan
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GitLeaks
        uses: zricethezav/gitleaks-action@v3.0.0
        with:
          args: "--repo-path=. --verbose"

  dependency-scan:
    name: Dependency Scan
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.base_ref || github.event.before }}
          head-ref: ${{ github.head_ref || github.sha }}

  container-scan:
    name: Container Scan
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image version
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build Docker image
        run: docker build -t java-maven-quickstart-service:${VERSION} .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: java-maven-quickstart-service:${{ env.VERSION }}

  sonar:
    name: Static Code Analysis
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: SonarCloud Scan
        continue-on-error: true
        run: mvn -B clean verify -Psonar -Dsonar.login=$SONAR_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [unit-test, contract-test, sonar, coverage, secret-scan, dependency-scan, container-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Deploy to Github Package Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>govindarajanv</username><password>${GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
          mvn clean deploy
      - name: Build Container Image
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          docker build -t govindarajanv/java-maven-quickstart-service:$VERSION .
          docker build -t govindarajanv/java-maven-quickstart-service:latest .
          docker images
      - name: Test Image
        run: |
          docker compose up -d
          docker ps
          sleep 60
          docker ps
          result=$(docker inspect --format='{{json .State.Health}}' calculator | jq ."Status")
          if [ "$result" != "\"healthy\"" ]; then exit 1; fi
      - name: Shut down the service
        run: docker compose down
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Publish the image
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          docker push govindarajanv/java-maven-quickstart-service:$VERSION
          docker push govindarajanv/java-maven-quickstart-service:latest
      - name: Share artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: target/*
          retention-days: 5

  integration-test:
    name: API Integration Testing
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v4
      - name: Get PWD
        run: echo $pwd
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: API Contract Testing
        run: echo "Integration Testing is Stubbed"

  gate:
    name: Release Gating and Approvals
    runs-on: ubuntu-latest
    needs: [integration-test]
    environment:
      name: heroku-prod
      url: https://dashboard.heroku.com/apps/java-maven-quickstart-service/activity
    steps:
      - name: Release Gating & Approval
        run: echo "Approvals are in place"

  deploy:
    name: Deploy/Release to production
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
          path: target/
      - name: Build, Push and Deploy to Heroku
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          docker login --username=$(heroku whoami) --password=$(heroku auth:token) registry.heroku.com
          docker build -t registry.heroku.com/java-maven-quickstart-service/web:$VERSION .
          docker build -t registry.heroku.com/java-maven-quickstart-service/web:latest .
          docker push registry.heroku.com/java-maven-quickstart-service/web:latest
          heroku container:login
          app_version=$(heroku apps:info java-maven-quickstart-service -j | jq ."dynos[0].release.version")
          echo "Current App version is $app_version"
          heroku container:rm web -a java-maven-quickstart-service || true
          heroku container:release web -a java-maven-quickstart-service
          app_version=$(heroku apps:info java-maven-quickstart-service -j | jq ."dynos[0].release.version")
          echo "Released App version is $app_version"
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
      - name: Post Deployment Check
        run: |
          sleep 60
          result=$(curl -s https://java-maven-quickstart-service.herokuapp.com/addition/1/2/3 | jq .result)
          if [ "$result" -eq 6 ]; then
            echo "Application is successfully deployed in production"
          else
            echo "Prod deployment failed"
            exit 1
          fi

  close:
    name: Close Issue
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: View context attributes
        uses: actions/github-script@v7
        with:
          script: console.log(context)
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createComment({
              issue_number: 20,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Thanks for reporting!'
            })
      - uses: actions/checkout@v4
      - name: Create check run
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 19,
              title: 'Deployed',
              body: JSON.stringify({ title: 'Deployed' })
            })
