name: Java Service with Maven

on:
  push:
    branches: [ feature-* ]
  pull_request:
    branches: [ develop ]

jobs:
  secret_scan:
    name: Find secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secrets finder
        uses: govindarajanv/secrets-finder@v2.7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Maven Verify
        run: mvn -B clean verify

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Generate coverage report
        run: mvn -B clean verify
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  validate:
    name: Build and Test Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Maven Install
        run: mvn -B clean install
      - name: Build Container Image
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          docker build -t govindarajanv/java-maven-quickstart-service:$VERSION .
          docker build -t govindarajanv/java-maven-quickstart-service:latest .
          docker images
      - name: Test Image
        run: |
          docker-compose up -d
          docker ps
          sleep 60
          docker ps
          result=$(docker inspect --format='{{json .State.Health}}' calculator | jq ."Status")
          if [ "$result" != "\"healthy\"" ]; then exit 1; fi
      - name: Shut down the service
        run: docker-compose down
