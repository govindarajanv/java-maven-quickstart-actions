name: Java Service with Maven

on:
  push:
    branches: [ feature-* ]
  pull_request:
    branches: [ develop ]

jobs:
  secret_scan:
    name: Find secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secrets finder
        uses: govindarajanv/secrets-finder@v2.7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B package -DskipTests
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar

  test:
    name: Unit Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: Maven Verify
        run: mvn -B test

  coverage:
    name: Code Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: Generate coverage report
        run: mvn -B test jacoco:report
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  validate:
    name: Build and Test Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/
      - name: Build Container Image
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          VERSION=$(xmllint --xpath "//*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          docker build -t govindarajanv/java-maven-quickstart-service:$VERSION .
          docker build -t govindarajanv/java-maven-quickstart-service:latest .
          docker images
      - name: Test Image
        run: |
          docker compose up -d
          docker ps
          sleep 60
          docker ps
          result=$(docker inspect --format='{{json .State.Health}}' calculator | jq ."Status")
          if [ "$result" != "\"healthy\"" ]; then exit 1; fi
      - name: Shut down the service
        run: docker compose down
